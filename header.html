<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Sklight</title>

</head>

<body>
    <header class="header">
        <div class="container">
            <div class="header__top">

                <div class="header__worktime">
                    <div class="contact__items worktime">
                        <i class="fa-solid fa-clock">🕕</i>
                        <span>Пн-Пт: 8:00 - 20:00</span>
                    </div>
                </div>
                <div class="header__socials">
                    <div class="contact__items socials">
                        <i class="fa-brands fa-vk">📧</i>
                        <i class="fa-brands fa-instagram">📧</i>
                        <i class="fa-brands fa-facebook">📧</i>
                    </div>
                </div>
                <div class="header__phones">
                    <div class="contact__items phones">
                        <i class="fa-solid fa-phone">📞</i>
                        <span>+7 (123) 456-78-90</span>
                    </div>
                </div>

            </div>
            <div class="header__btm">
                <div class="header__logo">
                    <a href="#" class="logo">
                        <img src="assets/img/logo.png" alt="Sklight Logo">
                    </a>
                </div>
                <nav class="header__menu">
                    <ul class="nav_links">
                        <li> <a href="#">ГЛАВНАЯ</a></li>
                        <li> <a href="#">УСЛУГИ</a></li>
                        <li> <a href="#">О НАС</a></li>
                        <li> <a href="#">НОВОСТИ</a></li>
                        <li> <a href="#">ГРАНТИЯ</a></li>
                        <li> <a href="#">КОНТАКТЫ</a></li>
                    </ul>
                </nav>
                <div class="header__btn">
                    <button class="contact-button btn">Оставить заявку</button>
                </div>
            </div>
        </div>
    </header>
</body>

</html>
